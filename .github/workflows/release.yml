# Release — publish @mcptoolshop/repomesh to npm via OIDC Trusted Publishing.
#
# Named `release.yml` to match the npm Trusted Publisher binding configured for
# this package (npmjs.com -> @mcptoolshop/repomesh -> Settings -> Trusted
# Publishers -> mcp-tool-shop-org/repomesh, workflow `release.yml`). Auth is
# OIDC — there is intentionally NO NODE_AUTH_TOKEN / NPM_TOKEN.
#
# Publish target is the monorepo package packages/repomesh-cli; the root is a
# private workspace and is never published.
#
# Workflow standards compliance (.claude/rules/workflow-standards.md):
#   PIN_PER_STEP (2)       — actions SHA-pinned; node + npm versions fixed.
#   ANDON_AUTHORITY (2)    — build/test/pack/tag-match gates run BEFORE publish;
#                            any failure halts the job (no continue-on-error).
#   NAMED_COMPENSATORS (3) — see table below; npm publish has a named undo.
#   EXTERNAL_VERIFIER (1)  — n/a to a publish step; CI tests gate in the org CIs.
#
# Compensators (irreversible actions — NO skip allowed):
#   | Action                | Undo                                              | Post-rollback state           | Owner |
#   |-----------------------|---------------------------------------------------|-------------------------------|-------|
#   | npm publish <version> | `npm deprecate @mcptoolshop/repomesh@<v> "broken  | version stays on registry but | Mike  |
#   |                       |  — use <prev>"` (npm forbids unpublish after 72h  | deprecated; consumers pin to  |       |
#   |                       |  / for depended-on pkgs); then publish <v+1>.     | <prev>; ship fixed <v+1>.     |       |
#   | GitHub Release create | `gh release delete <tag> --cleanup-tag`           | release + tag removed         | Mike  |
#   | GHCR image push       | `gh api -X DELETE orgs/mcp-tool-shop-org/packages/ | :<v> and :sha-<sha> removed;  | Mike  |
#   |                       |  container/repomesh/versions/<id>`                | image job runs after publish  |       |
#
# Both irreversible steps above happen only on a release event or a dispatch
# on a v* tag. A dispatch on main or any branch skips the publish job, and the
# image job (needs: publish) is skipped with it. Every run that publishes
# checks the tag against package.json first: the release's tag_name on a
# release event, the ref name on a tag dispatch.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to npm (OIDC trusted publisher)
    # A dispatch from a branch must not publish: only a release event or a
    # dispatch on a v* tag gets past this.
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read       # npm publish only; the GitHub Release is created separately
      id-token: write      # OIDC: npm trusted publishing + Sigstore provenance
    defaults:
      run:
        working-directory: packages/repomesh-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm >= 11.5 in sandbox for OIDC trusted-publishing auth
        working-directory: ${{ github.workspace }}
        run: |
          # Node 22 bundles npm 10.x, which cannot do OIDC trusted publishing,
          # and an in-place `npm i -g npm@latest` races its own arborist rebuild.
          # Install npm@latest into an isolated sandbox and shadow it via PATH.
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@latest
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: Install dependencies (workspace root)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Tag: ${RELEASE_TAG} -> ${TAG_VERSION} | Package: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Release tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build (src -> dist)
        run: node scripts/build.mjs

      - name: Test
        run: node --test tests/*.test.mjs

      - name: npm pack dry-run (verify tarball shape)
        run: npm pack --dry-run

      - name: Audit production dependencies
        working-directory: ${{ github.workspace }}
        run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=high --omit=dev --prefix anchor/xrpl

      - name: Publish to npm with provenance (OIDC trusted publisher)
        # Auth via npm Trusted Publishing (OIDC) — intentionally NO NODE_AUTH_TOKEN.
        run: npm publish --provenance --access public

  image:
    name: Publish container image
    # Only after the publish job's build, tests, pack check and audit passed
    # and the npm publish succeeded, so a broken build never pushes an image.
    # It also inherits the publish job's gate: when publish is skipped, so is this.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image tags
        id: tags
        working-directory: packages/repomesh-cli
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ${TAG_VERSION} does not match package.json version ${VERSION}"
            exit 1
          fi
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker build \
            -t "${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}" \
            -t "${{ steps.tags.outputs.image }}:sha-${GITHUB_SHA}" \
            .
          docker push "${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
          docker push "${{ steps.tags.outputs.image }}:sha-${GITHUB_SHA}"
