name: pages-ci

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'anchor/xrpl/manifests/**'
      - 'pages/**'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages-ci.yml'
  # The site is built on pull requests too, not only on the push that
  # deploys it. Without this, nothing in the PR-triggered set builds the
  # site, so a breaking site change cannot fail a PR -- only a deployment,
  # after main already has it. That is how audiobooker and comfy-headless
  # both went red on 2026-09-17 when Dependabot bumped @astrojs/starlight
  # to 0.42.1: Starlight 0.39 removed autogenerated sidebar groups carrying
  # a `label`, and site/astro.config.mjs still used that shape.
  #
  # This repo still declares Starlight <0.39, so its config is correct for
  # the version it pins -- the point of this gate is that the bump PR, when
  # it arrives, fails here and gets fixed in the same PR instead of landing
  # on main and taking the deploy down.
  #
  # Mirrors the push paths exactly: the Astro build consumes the output of
  # the registry/ and pages/ scripts, so a change to either can break the
  # site just as a change under site/ can.
  pull_request:
    branches: [main]
    paths:
      - 'registry/**'
      - 'anchor/xrpl/manifests/**'
      - 'pages/**'
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Split out of the former single build-and-deploy job so a pull request can
  # prove the build without claiming the github-pages environment, whose
  # deployment branch rules are main-only.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # STGB-CI-004: bound wall-clock (build)
    # Building needs no write scope, so a PR-triggered run never carries
    # pages:write or id-token:write. Only deploy asks.
    permissions:
      contents: read
    steps:
      # B-8: Actions pinned to major version tags (v4) — acceptable for this project.
      # Full SHA pinning not required; major tags provide auto-patching with low risk.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Build registry explorer into Astro public dir
      - name: Build anchor index
        run: node registry/scripts/build-anchors.mjs

      - name: Build badges
        run: node registry/scripts/build-badges.mjs

      - name: Build snippets
        run: node registry/scripts/build-snippets.mjs

      # B-4: Non-critical build steps use continue-on-error for graceful degradation
      - name: Build metrics
        run: node pages/build-metrics.mjs
        continue-on-error: true

      - name: Build timeline
        run: node pages/build-timeline.mjs
        continue-on-error: true

      - name: Build registry explorer
        run: |
          node pages/build-pages.mjs
          mkdir -p site/public
          cp -r pages/out/* site/public/

      # Build live stats for Astro landing page (B-4: non-critical)
      - name: Build stats
        run: node pages/build-stats.mjs
        continue-on-error: true

      # Build Astro landing page (includes registry explorer as static assets)
      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      # A PR run is a build check, not a deployment.
      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    # main is the only source of the published site. A PR proves the build,
    # it never publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5  # STGB-CI-004: bound wall-clock (Pages deploy)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
