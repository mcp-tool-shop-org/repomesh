name: registry-ci

on:
  workflow_run:
    workflows: [ledger-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-registry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10  # STGB-CI-004: bound wall-clock (build + network)
    permissions:
      contents: write
    steps:
      - name: Verify workflow_run origin (main of this repository only)
        if: github.event_name == 'workflow_run'
        env:
          WF_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WF_REPO: ${{ github.repository }}
          WF_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "${WF_HEAD_REPO}" != "${WF_REPO}" ]; then
            echo "::error::Refusing workflow_run from external repository ${WF_HEAD_REPO}"
            exit 1
          fi
          if [ "${WF_HEAD_BRANCH}" != "main" ]; then
            echo "::error::Refusing workflow_run from non-main branch ${WF_HEAD_BRANCH}"
            exit 1
          fi
          if [ "${WF_EVENT}" != "push" ] || [ "${WF_CONCLUSION}" != "success" ]; then
            echo "::error::Refusing workflow_run with event=${WF_EVENT} conclusion=${WF_CONCLUSION}"
            exit 1
          fi

      # B-8: Actions pinned to major version tags (v4) — acceptable for this project.
      # Full SHA pinning not required; major tags provide auto-patching with low risk.
      - name: Checkout main commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check registry-relevant path changes
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          WF_REPO: ${{ github.repository }}
          WF_EVENT_NAME: ${{ github.event_name }}
          WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${WF_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch — running registry build unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${WF_HEAD_SHA:-}" ]; then
            echo "No workflow_run head_sha provided — running registry build unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PRIOR_SHA=""
          if LAST_SHA="$(gh api "repos/${WF_REPO}/actions/workflows/registry-ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null)" && [ -n "$LAST_SHA" ]; then
            if git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$LAST_SHA" "$WF_HEAD_SHA" 2>/dev/null \
              && [ "$LAST_SHA" != "$WF_HEAD_SHA" ]; then
              PRIOR_SHA="$LAST_SHA"
            fi
          fi
          if [ -z "$PRIOR_SHA" ]; then
            echo "No reachable prior successful registry-ci head_sha found — running registry build unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$PRIOR_SHA" "$WF_HEAD_SHA" -- \
            'ledger/nodes/**' \
            'ledger/events/**' \
            'registry/scripts/**' \
            'profiles/**' \
            '.github/workflows/registry-ci.yml')"
          if [ -z "$CHANGED" ]; then
            echo "No registry paths changed between ${PRIOR_SHA} and ${WF_HEAD_SHA}. Exiting early."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Registry paths changed between ${PRIOR_SHA} and ${WF_HEAD_SHA}:"
          echo "$CHANGED"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.paths.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Validate profile snapshots
        if: steps.paths.outputs.changed == 'true'
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const nodesDir = 'ledger/nodes';
          const validProfiles = ['baseline', 'open-source', 'regulated'];
          let errors = 0;
          if (!fs.existsSync(nodesDir)) process.exit(0);
          for (const org of fs.readdirSync(nodesDir, { withFileTypes: true }).filter(d => d.isDirectory())) {
            for (const repo of fs.readdirSync(path.join(nodesDir, org.name), { withFileTypes: true }).filter(d => d.isDirectory())) {
              const profilePath = path.join(nodesDir, org.name, repo.name, 'repomesh.profile.json');
              if (!fs.existsSync(profilePath)) continue;
              try {
                const p = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
                if (!validProfiles.includes(p.profileId)) {
                  console.error('Invalid profile ' + p.profileId + ' in ' + profilePath);
                  errors++;
                }
                console.log('  OK ' + org.name + '/' + repo.name + ': ' + p.profileId);
              } catch (e) {
                console.error('Parse error in ' + profilePath + ': ' + e.message);
                errors++;
              }
            }
          }
          if (errors > 0) { console.error(errors + ' profile validation error(s)'); process.exit(1); }
          console.log('All profile snapshots valid.');
          "

      # B-5: All registry build scripts run in a single step with set -e
      # to prevent committing partial registry state on failure
      - name: Build registry (all indexes)
        if: steps.paths.outputs.changed == 'true'
        run: |
          set -e
          node registry/scripts/build-registry.mjs
          node registry/scripts/build-trust.mjs
          node registry/scripts/build-dependencies.mjs
          node registry/scripts/build-verifiers.mjs
          node registry/scripts/build-anchors.mjs
          node registry/scripts/build-badges.mjs
          node registry/scripts/build-snippets.mjs

      # `main` is a PROTECTED branch — a direct `git push` of the regenerated registry fails with
      # GH006 (protected branch update failed). When the derived registry drifts from the ledger,
      # open an AUTO-MERGING PR instead (mirrors the anchor/attestor cron pattern, which already
      # work against protection via the REPOMESH_LEDGER_TOKEN PAT). Idempotent: no drift => no PR.
      - name: Commit + PR registry changes (protected main)
        if: steps.paths.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPOMESH_LEDGER_TOKEN }}
        run: |
          git add registry/nodes.json registry/capabilities.json registry/trust.json registry/dependencies.json registry/verifiers.json registry/anchors.json registry/badges/ registry/snippets/
          if git diff --cached --quiet; then
            echo "No registry changes — committed registry is in sync with the ledger."
            exit 0
          fi
          BRANCH="registry/auto-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "repomesh-bot"
          git config user.email "repomesh-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -b "$BRANCH"
          git commit -m "registry: auto-update derived indexes (trust, verifiers, anchors, badges, snippets)"
          git push origin "$BRANCH"
          PR=$(gh pr create --head "$BRANCH" --base main \
            --title "registry: auto-update derived indexes" \
            --body "Automated registry regeneration after a ledger change — registry-ci cannot push to protected main, so this lands the derived indexes via an auto-merging PR.")
          gh pr merge --auto --merge "$PR" \
            || echo "::warning::Could not enable auto-merge on $PR. Enable once: gh api -X PATCH repos/${{ github.repository }} -f allow_auto_merge=true."
