name: ledger-ci

on:
  push:
    branches: [main]
    paths:
      - 'anchor/**'
      - 'attestor/**'
      - 'ledger/**'
      - 'packages/**'
      - 'pages/**'
      - 'policy/**'
      - 'profiles/**'
      - 'registry/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tools/**'
      - 'verifiers/**'
      - 'atlas/**'
      - 'package.json'
      - 'package-lock.json'
      - 'verifier.policy.json'
      - '.github/workflows/ledger-ci.yml'
      - '.github/workflows/registry-ci.yml'
  # No paths filter on pull requests, deliberately: this workflow emits the
  # required status checks (validate-ledger, test), and a PR that matched no
  # path (a docs-only change) would never report them and could never merge.
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  event-paths:
    name: event-paths
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Evaluate event-path guard from base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${BASE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "${PR_HEAD_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR metadata format (fail-closed)." >&2
            exit 1
          fi
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          export WORK_DIR

          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${REPO}/contents/scripts/ci/event-path-guard.mjs?ref=${BASE_SHA}" \
            > "${WORK_DIR}/event-path-guard.mjs"

          node - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { execFileSync } from "node:child_process";

          const repo = process.env.REPO;
          const prNumber = process.env.PR_NUMBER;
          const expectedHeadSha = process.env.PR_HEAD_SHA;
          const workDir = process.env.WORK_DIR;
          const eventPayload = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const senderLogin = eventPayload?.sender?.login || "";

          const ghJson = (args) => JSON.parse(execFileSync("gh", args, { encoding: "utf8" }));

          const pr = ghJson(["api", `repos/${repo}/pulls/${prNumber}`]);
          const filesPages = ghJson(["api", "--paginate", "--slurp", `repos/${repo}/pulls/${prNumber}/files?per_page=100`]);
          const files = filesPages.flat();

          const headSha = pr?.head?.sha || expectedHeadSha;
          const commit = ghJson(["api", `repos/${repo}/git/commits/${headSha}`]);
          const tree = ghJson(["api", `repos/${repo}/git/trees/${commit.tree.sha}?recursive=1`]);

          const headTreeEntries = {};
          for (const item of tree.tree || []) {
            headTreeEntries[item.path] = { mode: item.mode, type: item.type };
          }

          const readRole = (login) => {
            if (!login || !/^[A-Za-z0-9-]+(\[bot\])?$/.test(login)) return null;
            try {
              const res = ghJson(["api", `repos/${repo}/collaborators/${encodeURIComponent(login)}/permission`]);
              return typeof res?.role_name === "string" ? res.role_name : null;
            } catch {
              return null;
            }
          };

          const authorLogin = pr?.user?.login || "";
          const payload = {
            changedFilesCount: pr?.changed_files,
            expectedHeadSha,
            actualHeadSha: headSha,
            files,
            headTreeEntries,
            treeTruncated: Boolean(tree.truncated),
            authorLogin,
            authorRole: readRole(authorLogin),
            senderLogin,
            senderRole: readRole(senderLogin),
          };
          fs.writeFileSync(path.join(workDir, "guard-input.json"), JSON.stringify(payload), "utf8");
          NODE

          node "${WORK_DIR}/event-path-guard.mjs" "${WORK_DIR}/guard-input.json"

  validate-ledger:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # STGB-CI-004: bound wall-clock
    steps:
      # B-8: Actions pinned to major version tags (v4) — acceptable for this project.
      # Full SHA pinning not required; major tags provide auto-patching with low risk.
      - name: Checkout (full history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.26.0 check

      - name: Install ledger deps
        working-directory: ledger
        run: npm ci || npm install

      # LEDGER-A-007: fetch the base ledger FAIL-CLOSED.
      # The old `... || touch /tmp/base-events.jsonl` fell open: ANY git error (network
      # blip, missing fetch, detached ref) silently produced an EMPTY base, the validator
      # then took its "no base → first commit" path and SKIPPED the append-only / immutability
      # prefix check — so a reorder or truncation sailed through CI green. We now distinguish:
      #   (a) base genuinely absent on main (real first commit / bootstrap) — allowed ONLY when
      #       LEDGER_ALLOW_EMPTY_BASE=1 is explicitly set (default: not set);
      #   (b) any OTHER git failure — FAIL the step (non-zero) with an actionable message.
      - name: Extract base ledger from main (fail-closed)
        env:
          LEDGER_ALLOW_EMPTY_BASE: ${{ vars.LEDGER_ALLOW_EMPTY_BASE }}
        run: |
          set -euo pipefail
          BASE_REF="origin/main:ledger/events/events.jsonl"

          # 1. The ref itself must resolve. If origin/main is missing, the checkout/fetch is
          #    broken — that is an ERROR, never an empty base.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Cannot resolve origin/main. The base ledger could not be fetched"
            echo "::error::(fetch-depth/checkout failure). Refusing to validate against an EMPTY base,"
            echo "::error::which would silently skip the append-only/immutability check (LEDGER-A-007)."
            exit 1
          fi

          # 2. Does the ledger path exist in origin/main?
          if git cat-file -e "${BASE_REF}" 2>/dev/null; then
            # Path exists → extract it. A failure HERE (blob unreadable) is a hard error.
            git show "${BASE_REF}" > /tmp/base-events.jsonl
            echo "Base ledger extracted ($(wc -l < /tmp/base-events.jsonl) line(s))."
          else
            # Path absent on main. This is EITHER a legitimate first/bootstrap commit OR a
            # path/ref error. Only accept the empty base when explicitly authorized.
            if [ "${LEDGER_ALLOW_EMPTY_BASE:-}" = "1" ]; then
              echo "::warning::ledger/events/events.jsonl absent on origin/main and"
              echo "::warning::LEDGER_ALLOW_EMPTY_BASE=1 — treating as first commit (empty base)."
              : > /tmp/base-events.jsonl
            else
              echo "::error::ledger/events/events.jsonl not found in origin/main."
              echo "::error::Refusing to fall open to an empty base (LEDGER-A-007): an empty base"
              echo "::error::SKIPS the append-only/immutability check. If this is a genuine first"
              echo "::error::commit, set repo variable LEDGER_ALLOW_EMPTY_BASE=1 to authorize it."
              exit 1
            fi
          fi

      - name: Validate append-only + schema + signature + uniqueness
        working-directory: ledger
        env:
          BASE_LEDGER: /tmp/base-events.jsonl
          HEAD_LEDGER: events/events.jsonl
        run: npm run validate:ledger

      # B-7: Surface actionable error message on failure
      - name: Report failure details
        if: failure()
        run: |
          echo "::error::Ledger validation failed. Check the validator output above for details."
          echo "::error::Common causes: schema violation, invalid signature, duplicate event, or timestamp issue."
          echo "::error::See docs/handbook.md CI Troubleshooting section for resolution steps."

  test:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # STGB-CI-004: bound wall-clock
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix anchor/xrpl ci
          npm --prefix ledger ci

      - name: Build CLI
        run: npm --prefix packages/repomesh-cli run build

      - name: Run tests with coverage floor
        run: |
          node --test --experimental-test-coverage --test-coverage-exclude="**/*.test.mjs" --test-coverage-lines=57 \
            anchor/xrpl/tests/*.test.mjs \
            attestor/tests/*.test.mjs \
            ledger/tests/*.test.mjs \
            packages/repomesh-cli/tests/*.test.mjs \
            pages/tests/*.test.mjs \
            policy/tests/*.test.mjs \
            registry/tests/*.test.mjs \
            scripts/tests/*.test.mjs \
            tools/tests/*.test.mjs \
            verifiers/tests/*.test.mjs

      - name: Audit production dependencies
        run: |
          npm audit --audit-level=high --omit=dev
          npm audit --audit-level=high --omit=dev --prefix anchor/xrpl
          npm audit --audit-level=high --omit=dev --prefix ledger
